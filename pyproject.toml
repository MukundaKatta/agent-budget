[project]
name = "agent-budget"
version = "0.1.0"
description = "Production retry/budget primitive for LLM and agent calls: cost caps, attempt events, adversarial-loop detection. The thing tenacity isn't."
readme = "README.md"
authors = [
    { name = "Mukunda Katta", email = "mukunda.vjcs6@gmail.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["llm", "retry", "budget", "agent", "cost", "production"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/MukundaKatta/agent-budget"
Source = "https://github.com/MukundaKatta/agent-budget"
Issues = "https://github.com/MukundaKatta/agent-budget/issues"
Changelog = "https://github.com/MukundaKatta/agent-budget/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
